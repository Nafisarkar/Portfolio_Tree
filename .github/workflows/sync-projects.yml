name: Sync Portfolio Projects

on:
  schedule:
    - cron: "0 */12 * * *" # twice a day
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch GitHub Repos
        run: |
          curl https://api.github.com/users/Nafisarkar/repos > repos.json

      - name: Transform to portfolio schema
        run: |
          jq '[.[]
            | select(.fork == false)
            | {
                github_id: .id,
                title: .name,
                description: .description,
                link: .html_url,
                techstacks: (
                  ([.language] + (.topics // []))
                  | unique
                )
              }
          ]' repos.json > clean.json

      - name: Upsert into Supabase
        run: |
          curl -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/projects?on_conflict=github_id" \
          -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
          -H "Content-Type: application/json" \
          -H "Prefer: resolution=merge-duplicates" \
          --data @clean.json
